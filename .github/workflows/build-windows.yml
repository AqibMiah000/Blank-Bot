name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Electron Windows Distribution
        run: npm run build:electron

      - name: Compress Windows Distribution
        shell: pwsh
        run: |
          Compress-Archive -Path "release\win-unpacked\*" -DestinationPath "release\Blank-v1.30-Windows-x64.zip" -Force

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.30
          files: |
            release/Blank-v1.30-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
